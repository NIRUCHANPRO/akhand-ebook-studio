<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Akhand AI E-Book Studio 24/7</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen font-sans selection:bg-cyan-500 selection:text-slate-950">

  <div class="max-w-4xl mx-auto px-4 py-10">
    <!-- Header -->
    <div class="text-center mb-10">
      <span class="px-4 py-1.5 rounded-full bg-cyan-500/10 border border-cyan-400/30 text-cyan-400 text-xs font-bold tracking-widest uppercase">
        24/7 Cloud E-Book Publishing Engine
      </span>
      <h1 class="text-4xl md:text-5xl font-extrabold mt-4 bg-gradient-to-r from-cyan-400 via-sky-300 to-purple-400 bg-clip-text text-transparent">
        Akhand AI E-Book Studio
      </h1>
      <p class="text-slate-400 mt-2 text-sm md:text-base">
        Topic ya Syllabus daalo, Cover & Theme chuno, aur 24/7 Cloud Engine se High-Res Kindle PDF pao!
      </p>
    </div>

    <!-- Main Form Card -->
    <div class="bg-slate-900/90 border border-slate-800 rounded-2xl p-6 md:p-8 shadow-2xl space-y-6">
      
      <!-- Row 1: Title & Author -->
      <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <div>
          <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-2">Book Title (Optional)</label>
          <input id="title" type="text" placeholder="e.g. Akhand Unity & C# Masterclass"
            class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-cyan-400" />
        </div>
        <div>
          <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-2">Author Name</label>
          <input id="author" type="text" placeholder="e.g. Nirwan Sharma"
            class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-cyan-400" />
        </div>
      </div>

      <!-- Row 2: Cover Theme, Language & Volume -->
      <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
        <div>
          <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-2">Cover & Page Theme</label>
          <select id="theme" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-cyan-400">
            <option value="random">🎲 Auto-Random Pro Theme</option>
            <option value="obsidian">⚡ Kindle Obsidian Neon</option>
            <option value="sapphire">💎 O'Reilly Royal Sapphire</option>
            <option value="emerald">🌿 Emerald Cyber Press</option>
            <option value="crimson">🔥 Crimson Executive</option>
            <option value="violet">🔮 Violet Quantum</option>
          </select>
        </div>

        <div>
          <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-2">Writing Language & Style</label>
          <select id="language" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-cyan-400">
            <option value="hinglish">🇮🇳 Energetic Hinglish (Bhai/Dosto Style)</option>
            <option value="english">🇬🇧 Professional Textbook English</option>
          </select>
        </div>

        <div>
          <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-2">Book Length / Volume</label>
          <select id="volume" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-cyan-400">
            <option value="standard">📘 Standard Book (6-10 Chapters)</option>
            <option value="mega">📚 Mega Granth (18+ Deep Chapters / Full Syllabus)</option>
            <option value="quick">⚡ Quick 1-Chapter Guide / Story</option>
          </select>
        </div>
      </div>

      <!-- Row 3: Custom Cover Art Prompt -->
      <div>
        <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-2">
          Custom Cover Artwork Description (Khali chhodoge toh AI khud topic se banayega)
        </label>
        <input id="cover_prompt" type="text" placeholder="e.g. Futuristic game developer coding holographic 3D robot in dark neon studio"
          class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-cyan-400" />
      </div>

      <!-- Row 4: Topic / Full Syllabus -->
      <div>
        <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-2">
          Book Topic / Story Idea / Full Chapter Syllabus *
        </label>
        <textarea id="topic" rows="7" placeholder="Yahan apna topic likho ya poora Chapter 1, Chapter 2... wala syllabus paste kar do!"
          class="w-full bg-slate-950 border border-slate-800 rounded-xl p-4 text-sm focus:outline-none focus:border-cyan-400"></textarea>
      </div>

      <!-- Generate Button -->
      <button id="genBtn" onclick="startGeneration()"
        class="w-full py-4 rounded-xl font-bold text-slate-950 bg-gradient-to-r from-cyan-400 to-sky-400 hover:from-cyan-300 hover:to-sky-300 transition shadow-lg shadow-cyan-500/20">
        🚀 Generate High-Res E-Book PDF
      </button>

      <!-- Live Progress Box (Hidden initially) -->
      <div id="progressBox" class="hidden pt-4 border-t border-slate-800 space-y-4">
        <div class="flex justify-between items-center text-sm">
          <span id="statusText" class="text-cyan-400 font-semibold animate-pulse">Starting Cloud Engine...</span>
          <span id="percentText" class="font-mono font-bold text-slate-200">0%</span>
        </div>
        <div class="w-full h-4 bg-slate-950 rounded-full overflow-hidden border border-slate-800 p-0.5">
          <div id="progressBar" class="h-full bg-gradient-to-r from-cyan-400 via-sky-500 to-purple-500 rounded-full transition-all duration-500" style="width: 2%"></div>
        </div>
        <!-- Download Button (Shows at 100%) -->
        <a id="downloadBtn" href="#" target="_blank"
          class="hidden block text-center w-full py-4 rounded-xl font-bold text-white bg-emerald-600 hover:bg-emerald-500 transition shadow-lg shadow-emerald-600/30">
          📥 Download Your Completed E-Book (PDF)
        </a>
      </div>

    </div>
  </div>

  <script>
    let pollTimer = null;

    async function startGeneration() {
      const topic = document.getElementById("topic").value.trim();
      if (!topic) {
        alert("Bhai pehle Topic ya Syllabus toh daalo!");
        return;
      }

      const btn = document.getElementById("genBtn");
      const pBox = document.getElementById("progressBox");
      const dBtn = document.getElementById("downloadBtn");
      btn.disabled = true;
      btn.classList.add("opacity-50");
      pBox.classList.remove("hidden");
      dBtn.classList.add("hidden");

      const payload = {
        title: document.getElementById("title").value,
        author: document.getElementById("author").value,
        theme: document.getElementById("theme").value,
        language: document.getElementById("language").value,
        volume: document.getElementById("volume").value,
        cover_prompt: document.getElementById("cover_prompt").value,
        topic: topic
      };

      try {
        const res = await fetch("/.netlify/functions/api?action=start", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload)
        });
        const data = await res.json();
        if (data.error) throw new Error(data.error);

        updateUI(5, data.message || "Job started on GitHub Cloud...");
        pollTimer = setInterval(() => checkStatus(data.job_id), 4000);
      } catch (err) {
        alert("Error: " + err.message);
        btn.disabled = false;
        btn.classList.remove("opacity-50");
      }
    }

    async function checkStatus(jobId) {
      try {
        const res = await fetch(`/.netlify/functions/api?action=status&job_id=${jobId}`);
        const data = await res.json();
        updateUI(data.progress || 5, data.message || "Processing...");

        if (data.done) {
          clearInterval(pollTimer);
          const btn = document.getElementById("genBtn");
          btn.disabled = false;
          btn.classList.remove("opacity-50");

          if (data.pdf_url) {
            const dBtn = document.getElementById("downloadBtn");
            dBtn.href = data.pdf_url;
            dBtn.classList.remove("hidden");
          }
        }
      } catch (e) {
        console.log("Polling...", e);
      }
    }

    function updateUI(pct, msg) {
      document.getElementById("progressBar").style.width = `${pct}%`;
      document.getElementById("percentText").innerText = `${pct}%`;
      document.getElementById("statusText").innerText = msg;
    }
  </script>
</body>
</html>
